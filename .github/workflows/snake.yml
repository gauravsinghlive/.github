name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3

        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#151B23,#9BE9A8,#40C463,#30A14E,#216E39&color_snake=#166534
            dist/github-contribution-grid-snake-dark.svg?color_dots=#151B23,#9BE9A8,#40C463,#30A14E,#216E39&color_snake=#166534
            
      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
